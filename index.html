<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, address, link preview and structured data: filled in
         per page by the seo plugin in vite.config.ts from src/content/site.ts. -->
    <!-- seo -->
    <meta name="theme-color" content="#F1F0EC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&f[]=switzer@400,500,600&display=swap" />
    <link rel="preconnect" href="https://marjondoping.com" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 640px; margin: 64px auto; padding: 0 16px; color: #0e0e0e">
        <h1 style="font-weight: 400; letter-spacing: -0.03em">Angeline Seveses</h1>
        <p>Web designer and WordPress developer: website design, WordPress development and website maintenance.</p>
        <p><a href="mailto:angelinseveses@gmail.com?subject=Project%20inquiry">angelinseveses@gmail.com</a></p>
      </div>
    </noscript>
    <!-- How Netlify Forms finds the contact form, which React draws after the page
         loads. Never shown. Keep the names in step with src/lib/submitInquiry.ts. -->
    <form name="inquiry" data-netlify="true" netlify-honeypot="website" hidden>
      <input name="name" />
      <input type="email" name="email" />
      <input name="company" />
      <input name="needs" />
      <textarea name="message"></textarea>
      <input name="budget" />
      <input name="timeline" />
      <input name="website" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
